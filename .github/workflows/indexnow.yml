name: IndexNow ping (Bing, Yandex, Seznam, Naver, Yep)

# Runs after every successful Vercel deployment of main (Vercel reports a commit status "Vercel")
# and manually from the Actions tab. Tells IndexNow search engines to re-crawl the pages.
on:
  status:
  workflow_dispatch:

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' &&
       startsWith(github.event.context, 'Vercel') &&
       contains(toJSON(github.event.branches.*.name), '"main"'))
    runs-on: ubuntu-latest
    env:
      HOST: creator-studio-ai-psi.vercel.app
      KEY: 8929cfbb395e30a5a3fa23cccd19a7c0
    steps:
      - name: Check that the key file is live
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "https://$HOST/$KEY.txt" || true)
            [ "$body" = "$KEY" ] && echo "key file OK" && exit 0
            echo "key file not live yet, waiting..."; sleep 20
          done
          echo "key file https://$HOST/$KEY.txt is not reachable"; exit 1
      - name: Ping IndexNow
        run: |
          # every <loc> of the live sitemap (all tools x EN/RU/UA)
          urls=$(curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##' | sed 's/.*/"&"/' | paste -sd, -)
          [ -n "$urls" ] || urls="\"https://$HOST/\",\"https://$HOST/thumbnails\",\"https://$HOST/repurpose\""
          payload=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s.txt","urlList":[%s]}' \
            "$HOST" "$KEY" "$HOST" "$KEY" "$urls")
          echo "$payload"
          for ep in https://api.indexnow.org/indexnow https://www.bing.com/indexnow https://yandex.com/indexnow; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$ep" \
              -H 'Content-Type: application/json; charset=utf-8' -d "$payload")
            echo "$ep -> HTTP $code $(head -c 200 /tmp/out)"
            if [ "$ep" = "https://api.indexnow.org/indexnow" ] && [ "$code" != "200" ] && [ "$code" != "202" ]; then
              failed=1
            fi
          done
          [ -z "$failed" ] || { echo "IndexNow rejected the request"; exit 1; }
